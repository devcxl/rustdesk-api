version: 2
updates:
  # Go modules (go.mod / go.sum at repo root)
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Admin frontend (pnpm lockfile is handled by the npm ecosystem)
  - package-ecosystem: npm
    directory: "/admin"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # GitHub Actions pinned by commit SHA; Dependabot keeps SHA + version comment in sync
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Dockerfile base images
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
