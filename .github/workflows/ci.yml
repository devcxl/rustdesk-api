name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Code Quality & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go environment
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      # 运行 govulncheck 扫描 Go 依赖与标准库中的已知漏洞（PR/push 均执行）
      - name: Go vulnerability check (govulncheck)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        # 非阻断: Go 1.23 标准库公告可能先于工具链升级出现, 结果仍保留在 CI 日志中
        continue-on-error: true
        with:
          go-version-input: '1.23'
          go-package: ./...
          repo-checkout: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'admin/pnpm-lock.yaml'

      - name: Build admin frontend
        working-directory: admin
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Verify Go Build
        run: go build -o /dev/null ./cmd/apimain.go

      - name: Upload admin frontend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-dist
          path: resources/admin/
          if-no-files-found: error
          retention-days: 1

  # 4 架构全量交叉编译仅在合并入 master 或手动触发时执行，加速 PR 反馈
  build:
    name: Cross-Build ${{ matrix.job.goos }}-${{ matrix.job.platform }}
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - { platform: "amd64", goos: "linux", file_ext: "tar.gz" }
          - { platform: "arm64", goos: "linux", file_ext: "tar.gz" }
          - { platform: "armv7l", goos: "linux", file_ext: "tar.gz" }
          - { platform: "amd64", goos: "windows", file_ext: "zip" }
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare admin output directory
        run: rm -rf resources/admin && mkdir -p resources/admin

      - name: Download admin frontend
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: admin-dist
          path: resources/admin/

      - name: Set up Go environment
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'

      - name: Build for ${{ matrix.job.goos }}-${{ matrix.job.platform }}
        env:
          TARGET_GOOS: ${{ matrix.job.goos }}
          TARGET_PLATFORM: ${{ matrix.job.platform }}
          ARCHIVE_EXTENSION: ${{ matrix.job.file_ext }}
        run: bash .github/scripts/build-apimain.sh

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.job.goos }}-${{ matrix.job.platform }}
          path: ${{ matrix.job.goos }}-${{ matrix.job.platform }}.${{ matrix.job.file_ext }}
