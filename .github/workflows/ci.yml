name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Code Quality & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'admin/pnpm-lock.yaml'

      - name: Build admin frontend
        working-directory: admin
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Verify Go Build
        run: go build -o /dev/null ./cmd/apimain.go

      - name: Upload admin frontend
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: resources/admin/
          if-no-files-found: error
          retention-days: 1

  # 4 架构全量交叉编译仅在合并入 master 或手动触发时执行，加速 PR 反馈
  build:
    name: Cross-Build ${{ matrix.job.goos }}-${{ matrix.job.platform }}
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - { platform: "amd64", goos: "linux", file_ext: "tar.gz" }
          - { platform: "arm64", goos: "linux", file_ext: "tar.gz" }
          - { platform: "armv7l", goos: "linux", file_ext: "tar.gz" }
          - { platform: "amd64", goos: "windows", file_ext: "zip" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare admin output directory
        run: rm -rf resources/admin && mkdir -p resources/admin

      - name: Download admin frontend
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: resources/admin/

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build for ${{ matrix.job.goos }}-${{ matrix.job.platform }}
        env:
          TARGET_GOOS: ${{ matrix.job.goos }}
          TARGET_PLATFORM: ${{ matrix.job.platform }}
          ARCHIVE_EXTENSION: ${{ matrix.job.file_ext }}
        run: bash .github/scripts/build-apimain.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.job.goos }}-${{ matrix.job.platform }}
          path: ${{ matrix.job.goos }}-${{ matrix.job.platform }}.${{ matrix.job.file_ext }}
