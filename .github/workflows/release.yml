name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rustdesk-api

jobs:
  # 前端单独构建一次，供所有平台打包复用
  frontend:
    name: Build Admin Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'admin/pnpm-lock.yaml'

      - name: Build admin frontend
        working-directory: admin
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: resources/admin/
          if-no-files-found: error
          retention-days: 1

  # 原生构建产物：四平台打包并上传到 GitHub Release
  build:
    name: Build ${{ matrix.job.goos }}-${{ matrix.job.platform }}
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          - { platform: "amd64", goos: "linux", file_ext: "tar.gz" }
          - { platform: "arm64", goos: "linux", file_ext: "tar.gz" }
          - { platform: "armv7l", goos: "linux", file_ext: "tar.gz" }
          - { platform: "amd64", goos: "windows", file_ext: "zip" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare admin output directory
        run: rm -rf resources/admin && mkdir -p resources/admin

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: resources/admin/

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Get tag version
        run: |
          TAG_VERSION="${GITHUB_REF##*/}"
          VERSION="${TAG_VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Write version to resources/version
        run: echo $VERSION > resources/version

      - name: Build for ${{ matrix.job.goos }}-${{ matrix.job.platform }}
        env:
          TARGET_GOOS: ${{ matrix.job.goos }}
          TARGET_PLATFORM: ${{ matrix.job.platform }}
          ARCHIVE_EXTENSION: ${{ matrix.job.file_ext }}
        run: bash .github/scripts/build-apimain.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-api-${{ matrix.job.goos }}-${{ matrix.job.platform }}
          path: |
            ${{ matrix.job.goos}}-${{ matrix.job.platform }}.${{matrix.job.file_ext}}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            ${{ matrix.job.goos}}-${{ matrix.job.platform }}.${{matrix.job.file_ext}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Docker 多架构镜像：复用 linux 构建产物，一次构建多架构 manifest 推送到 GHCR
  docker:
    # Tag-triggered drafts must not publish a public container image.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Docker multi-arch image to GHCR
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binaries (amd64)
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-api-linux-amd64
          path: .

      - name: Download binaries (arm64)
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-api-linux-arm64
          path: .

      - name: Download binaries (armv7l)
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-api-linux-armv7l
          path: .

      - name: Extract binaries
        run: |
          for p in amd64 arm64 armv7l; do
            mkdir -p $p
            tar -xzf linux-$p.tar.gz -C $p
          done

      - name: Get tag version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "TAG=latest" >> $GITHUB_ENV
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: "."
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
