basePath: /api
definitions:
  admin.ChangeCurPasswordForm:
    properties:
      new_password:
        maxLength: 32
        minLength: 4
        type: string
      old_password:
        maxLength: 32
        minLength: 4
        type: string
    required:
    - new_password
    - old_password
    type: object
  admin.LoginPayload:
    properties:
      avatar:
        type: string
      email:
        type: string
      nickname:
        type: string
      route_names:
        items:
          type: string
        type: array
      token:
        type: string
      username:
        type: string
    type: object
  admin.PeerBatchDeleteForm:
    properties:
      row_ids:
        items:
          type: integer
        type: array
    required:
    - row_ids
    type: object
  admin.PeerForm:
    properties:
      alias:
        type: string
      cpu:
        type: string
      group_id:
        type: integer
      hostname:
        type: string
      id:
        type: string
      memory:
        type: string
      os:
        type: string
      row_id:
        type: integer
      username:
        type: string
      uuid:
        type: string
      version:
        type: string
    type: object
  admin.UserOauthItem:
    properties:
      op:
        type: string
      status:
        type: integer
    type: object
  model.Peer:
    properties:
      alias:
        type: string
      cpu:
        type: string
      created_at:
        type: string
      group_id:
        type: integer
      hostname:
        type: string
      id:
        type: string
      last_online_ip:
        type: string
      last_online_time:
        type: integer
      memory:
        type: string
      os:
        type: string
      row_id:
        type: integer
      updated_at:
        type: string
      user:
        $ref: '#/definitions/model.User'
      user_id:
        type: integer
      username:
        type: string
      uuid:
        type: string
      version:
        type: string
    type: object
  model.PeerList:
    properties:
      list:
        items:
          $ref: '#/definitions/model.Peer'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  model.StatusCode:
    enum:
    - 1
    - 2
    type: integer
    x-enum-comments:
      COMMON_STATUS_DISABLED: 通用状态 禁用
      COMMON_STATUS_ENABLE: 通用状态 启用
    x-enum-varnames:
    - COMMON_STATUS_ENABLE
    - COMMON_STATUS_DISABLED
  model.User:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      group_id:
        type: integer
      id:
        type: integer
      is_admin:
        type: boolean
      nickname:
        type: string
      remark:
        type: string
      status:
        $ref: '#/definitions/model.StatusCode'
      updated_at:
        type: string
      username:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
info:
  contact: {}
  description: 接口
  title: 管理系统API
  version: "1.0"
paths:
  /admin/config/admin:
    get:
      consumes:
      - application/json
      description: ADMIN服务配置
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: ADMIN服务配置
      tags:
      - ADMIN
  /admin/config/app:
    get:
      consumes:
      - application/json
      description: APP服务配置
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: APP服务配置
      tags:
      - ADMIN
  /admin/config/server:
    get:
      consumes:
      - application/json
      description: 服务配置,给webclient提供api-server
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: RUSTDESK服务配置
      tags:
      - ADMIN
  /admin/file/oss_token:
    get:
      consumes:
      - application/json
      description: 获取ossToken
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: 获取ossToken
      tags:
      - 文件
  /admin/file/upload:
    post:
      consumes:
      - multipart/form-data
      description: 上传文件到本地
      parameters:
      - description: 上传文件示例
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: 上传文件到本地
      tags:
      - 文件
  /admin/login-options:
    post:
      consumes:
      - application/json
      description: 登录选项
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 登录选项
      tags:
      - 登录
  /admin/logout:
    post:
      consumes:
      - application/json
      description: 登出
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: 登出
      tags:
      - 登录
  /admin/oidc/auth:
    post:
      consumes:
      - application/json
      description: OidcAuth
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: OidcAuth
      tags:
      - Oauth
  /admin/oidc/auth-query:
    get:
      consumes:
      - application/json
      description: OidcAuthQuery
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/admin.LoginPayload'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: OidcAuthQuery
      tags:
      - Oauth
  /admin/peer/batchDelete:
    post:
      consumes:
      - application/json
      description: 批量设备删除
      parameters:
      - description: 设备id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.PeerBatchDeleteForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: 批量设备删除
      tags:
      - 设备
  /admin/peer/create:
    post:
      consumes:
      - application/json
      description: 创建设备
      parameters:
      - description: 设备信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.PeerForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Peer'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: 创建设备
      tags:
      - 设备
  /admin/peer/delete:
    post:
      consumes:
      - application/json
      description: 设备删除
      parameters:
      - description: 设备信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.PeerForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: 设备删除
      tags:
      - 设备
  /admin/peer/detail/{id}:
    get:
      consumes:
      - application/json
      description: 设备详情
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Peer'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: 设备详情
      tags:
      - 设备
  /admin/peer/list:
    get:
      consumes:
      - application/json
      description: 设备列表
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 页大小
        in: query
        name: page_size
        type: integer
      - description: 时间
        in: query
        name: time_ago
        type: integer
      - description: ID
        in: query
        name: id
        type: string
      - description: 主机名
        in: query
        name: hostname
        type: string
      - description: uuids 用逗号分隔
        in: query
        name: uuids
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.PeerList'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: 设备列表
      tags:
      - 设备
  /admin/peer/update:
    post:
      consumes:
      - application/json
      description: 设备编辑
      parameters:
      - description: 设备信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.PeerForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Peer'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: 设备编辑
      tags:
      - 设备
  /admin/user/changeCurPwd:
    post:
      consumes:
      - application/json
      description: 修改当前用户密码
      parameters:
      - description: 用户信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.ChangeCurPasswordForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: 修改当前用户密码
      tags:
      - 用户
  /admin/user/current:
    get:
      consumes:
      - application/json
      description: 当前用户
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/admin.LoginPayload'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: 当前用户
      tags:
      - 用户
  /admin/user/myOauth:
    get:
      consumes:
      - application/json
      description: 我的授权
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/admin.UserOauthItem'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: 我的授权
      tags:
      - 用户
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
  token:
    in: header
    name: api-token
    type: apiKey
swagger: "2.0"
